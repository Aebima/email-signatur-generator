services:
  frontend:
    image: registry.gitlab.ost.ch:45023/ifs/ipa/mail-signatur-generator/email-signatur-generator/frontend:latest
    ports:
      - "3000:3000"
    deploy:
      labels:
        caddy: email-signatur-generator-frontend.sifs0005.infs.ch
        caddy.reverse_proxy: '{{ upstreams 3000 }}'
    networks:
      - default
      - web
    restart: unless-stopped
  backend:
    image: registry.gitlab.ost.ch:45023/ifs/ipa/mail-signatur-generator/email-signatur-generator/backend:latest
    ports:
      - "3001:80"
    deploy:
      labels:
        caddy: email-signatur-generator-backend.sifs0005.infs.ch
        caddy.reverse_proxy: '{{ upstreams 80 }}'
    networks:
      - default
      - web
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - PORT=80
      - NODE_ENV=production
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    restart: unless-stopped

networks:
  web:
    external: true

volumes:
  postgres_data: 
